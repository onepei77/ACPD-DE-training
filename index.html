<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1d1d1f">
<title>數位檢定展演練習｜德誼 內部訓練</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--sub:#6e6e73;--line:#e3e3e8;--accent:#0071e3;--accent-ink:#fff;--accent-bg:#eaf3ff;--topic:#c2410c;--topic-bg:#fff1e6;--warn:#b35c00;--warnbg:#fff4e5;--ok:#1a7f37;--need:#fff7e0;--rec:#f1f6ff;--say:#fff9eb;--sayline:#ff9f0a}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--sub:#a1a1a6;--line:#38383a;--accent:#2997ff;--accent-ink:#000;--accent-bg:#10243a;--topic:#ffb340;--topic-bg:#3a2a10;--warn:#ffb340;--warnbg:#3a2a10;--ok:#30d158;--need:#2b2610;--rec:#0c1a2b;--say:#2a2312;--sayline:#ff9f0a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:16px 14px 8px}
h1{font-size:24px;line-height:1.3;margin:12px 0 4px}
h2{font-size:18px;margin:0}
p{margin:0}
.sub{color:var(--sub);font-size:14px}
.cl{display:inline-block}
.btn{display:block;width:100%;min-height:52px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:600 17px/1.3 inherit;padding:12px 16px;text-align:center;cursor:pointer}
.btn.sec{background:var(--card);color:var(--accent);border:1.5px solid var(--line)}
.btn.sm{min-height:40px;font-size:14px;border-radius:12px;padding:6px 10px}
.btn[disabled]{cursor:not-allowed}
.btn small{display:block;font-weight:400;font-size:13px;opacity:.85;margin-top:2px}
.stack>*+*{margin-top:12px}
.home .big{padding:20px 16px}
.note{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--sub)}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.top .back{flex:0 0 auto;width:auto;min-height:40px;padding:6px 14px;font-size:15px}
.tabs{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:12px;margin:8px 0 12px}
.tabs button{flex:1;border:0;border-radius:9px;padding:10px 6px;background:transparent;color:var(--ink);font:600 15px inherit;cursor:pointer;min-height:42px}
.tabs button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
/* 機型／題型 */
.hero{display:flex;flex-direction:column;gap:8px}
.hero .hb{border-radius:14px;padding:10px 14px}
.hero .hb span{display:block;font-size:12px;font-weight:700;letter-spacing:.12em;opacity:.85}
.hero .hb b{display:block;font-size:26px;line-height:1.25;font-weight:800}
.hero .hb.m{background:var(--accent);color:var(--accent-ink)}
.hero .hb.t{background:var(--topic-bg);color:var(--topic);border:2px solid var(--topic)}
.hero .hb.t b{font-size:22px}
.seg{display:flex;gap:6px;margin:10px 0 0;font-size:14px;align-items:center}
.seg span{color:var(--sub)}
.seg button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 12px;font:600 13px inherit;cursor:pointer;min-height:36px}
.seg button.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.mt2{margin:10px 0 4px;padding:8px 12px;border-radius:10px;background:var(--warnbg);color:var(--warn);font-size:14px;font-weight:600}
/* 計時 */
.timers{margin:10px 0 2px}
.timer{display:flex;align-items:center;gap:8px;margin:6px 0}
.timer .tl{font-size:12px;color:var(--sub);font-weight:700;min-width:54px}
.timer .t{font:700 22px/1 ui-monospace,SFMono-Regular,Menlo,monospace;min-width:62px}
.timer .btn{width:auto;flex:1}
.timer.remind .t{color:var(--warn)}
.timer.over .t{color:#d70015}
.tb{padding:6px 12px;border-radius:10px;background:var(--warnbg);color:var(--warn);font-size:14px;font-weight:600;margin:2px 0 6px}
.tip{font-size:14px;color:var(--sub);margin-top:6px}
/* 客人情境 */
.lab{font-size:13px;font-weight:700;color:var(--accent);margin:12px 0 2px;letter-spacing:.04em}
.cust{margin-top:12px}
.cust .lab:first-child{margin-top:0}
ul.bl{margin:2px 0 0;padding-left:20px;list-style:disc}
ul.bl li{margin:3px 0}
.cust ul.bl li{font-size:17px}
/* 步驟按鈕 */
.steps{margin-top:16px}
.steps .btn{font-size:18px;font-weight:800;min-height:62px;display:flex;align-items:center;justify-content:center;gap:10px;text-align:left}
.steps .btn .n{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--accent-ink);color:var(--accent);font:800 17px/30px -apple-system,sans-serif;text-align:center}
.steps .btn small{font-size:13px;font-weight:500;margin-top:1px}
.steps .btn.go{box-shadow:0 4px 14px rgba(0,113,227,.4)}
.steps .btn.lock{background:transparent;color:var(--sub);border:2px dashed var(--line);font-weight:600;box-shadow:none;margin-top:10px}
.steps .btn.lock .n{background:var(--line);color:var(--sub)}
.steps .btn.next{margin-top:12px}
.done{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ok)}
.need,.recbox{border-radius:14px;padding:12px 14px;margin-top:12px}
.need{background:var(--need)}
.recbox{background:var(--rec)}
.need ul.bl li{font-size:17px;margin:4px 0}
.need .nt{display:block;font-size:13px;color:var(--sub);margin:2px 0 0;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px;font:600 14px inherit;cursor:pointer;min-height:40px}
.chip.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font:500 15px/1.45 inherit;cursor:pointer;min-height:48px}
.pitem b{flex:0 0 auto;min-width:22px;height:22px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:13px;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}
.pitem span{flex:1;min-width:0;word-break:break-word}
.pitem em{display:block;font-style:normal;font-size:12px;color:var(--sub);margin-bottom:2px}
.fgrp{font-size:13px;font-weight:700;color:var(--sub);margin:12px 0 6px}
.fsel{background:var(--topic-bg);border:2px solid var(--topic);border-radius:14px;padding:10px 14px}
.fsel b{display:block;font-size:18px;color:var(--topic)}
.fsel small{display:block;font-size:13px;color:var(--sub);margin-top:2px}
.navb{margin-top:22px;padding-top:12px;border-top:1px dashed var(--line)}
.navb .l{font-size:12px;color:var(--sub);margin-bottom:6px}
.rowbtn{display:flex;gap:8px;flex-wrap:wrap}
.rowbtn .btn{flex:1;min-width:130px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--sub);font-weight:500;min-height:42px;font-size:14px;border-radius:10px}
/* 推薦：標題層級 */
.stage{margin:20px -2px 8px;padding:10px 14px;border-radius:12px;background:var(--ink);color:var(--card);font-size:17px;font-weight:800;line-height:1.35}
.stage small{display:block;font-size:13px;font-weight:500;opacity:.8;margin-top:2px}
.proj{margin:16px 0 8px;padding:9px 14px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:17px;font-weight:800;border-left:10px solid rgba(0,0,0,.25)}
.bridge{margin:12px 2px 4px;padding:8px 12px;border-left:4px solid var(--line);color:var(--sub);font-size:14px}
/* 功能卡 */
.fn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;margin:8px 0}
.fn .fh{display:flex;flex-wrap:wrap;align-items:center;gap:4px 0}
.fn .no{display:inline-block;font-size:12px;color:var(--accent);font-weight:700;margin-right:6px}
.fn .nm{font-size:17px;font-weight:800}
.fn .lab:first-of-type{margin-top:8px}
.good-t{font-weight:700}
.say{margin-top:10px;background:var(--say);border-left:4px solid var(--sayline);border-radius:8px;padding:8px 12px}
.say .lab{margin:0 0 2px}
.say p{font-size:16px;line-height:1.75}
ol.st{margin:2px 0 0;padding:0;list-style:none;counter-reset:s}
ol.st li{counter-increment:s;position:relative;padding:4px 0 4px 30px;margin:0}
ol.st li::before{content:counter(s);position:absolute;left:0;top:5px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 12px/22px -apple-system,sans-serif;text-align:center}
.plab{font-size:13px;font-weight:700;margin-top:6px}
.w{margin-top:8px;font-size:13px;color:var(--warn);background:var(--warnbg);padding:6px 10px;border-radius:8px}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:4px;background:var(--warnbg);color:var(--warn);vertical-align:1px}
.swap{font-size:13px;color:var(--ok);margin-top:6px}
/* 一覽 */
.outline{margin:10px 0 4px;border:1.5px solid var(--accent);border-radius:12px;padding:10px 12px;background:var(--card)}
.outline .ot{font-size:14px;font-weight:800;color:var(--accent);margin-bottom:4px}
.outline ol{list-style:none;margin:0;padding:0;counter-reset:o}
.outline li{counter-increment:o;position:relative;padding:6px 0 6px 30px;border-top:1px solid var(--line)}
.outline li:first-child{border-top:0}
.outline li::before{content:counter(o);position:absolute;left:0;top:7px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 12px/22px -apple-system,sans-serif;text-align:center}
.outline li b{display:block;font-size:13px;color:var(--sub)}
.outline li span{display:block;font-size:16px;font-weight:700}
.outline .og{font-size:13px;font-weight:800;color:var(--topic);margin:8px 0 0;padding-top:6px;border-top:2px solid var(--line)}
footer{margin-top:24px;padding:18px 14px calc(18px + env(safe-area-inset-bottom));text-align:center;border-top:1px solid var(--line);background:var(--card)}

 }else{
  G('硬體展演（4 分鐘）');
  R('點題：購買族群','說出客人是誰');R('外觀設計','機身、顏色、重量');
  u.hw.forEach(function(x){R('硬體好處',tagName(c,x[0]))});
  R('適合情境','收尾示範');
  G('軟體展演（4 分鐘）');
  SW_FOR[c.model][c.ci][c.topic].forEach(function(id){R('功能',nm(id))});
 }
 R('收尾','回扣痛點');
 var html='',open=false;
 rows.forEach(function(r){
  if(r[0]==='g'){if(open)html+='</ol>';html+='<div class="og">'+esc(r[1])+'</div><ol>';open=true}
  else{if(!open){html+='<ol>';open=true}html+='<li><b>'+esc(r[1])+'</b><span>'+esc(r[2])+'</span></li>'}
 });
 return '<div class="outline"><div class="ot">展演順序一覽</div>'+html+(open?'</ol>':'')+'</div>';
}

// ---------- 推薦內容 ----------
function recIphone(c){
 var u=cust(c),m=M_IOS[c.model];var h='';
 h+=stage('① 快速展演（約 1 分鐘）','外觀（顏色＋材質）＋ 1 項硬體');
 h+=itemHtml('外觀設計（顏色＋材質）',m.design,'手持機身，挑一個襯這位客人的顏色介紹',hwScript(c,'design',u,''));
 h+=itemHtml('硬體：'+tagName(c,u.hw[0]),m[u.hw[0]],u.hw[1],hwScript(c,u.hw[0],u,u.hw[1]));
 h+=bridge('硬體說完，接著針對您的需求，用實際功能示範給您看。');
 h+=stage('② 功能展演',TOPICS_IOS.iphone[c.topic].note);
 var order=[],seen={};u.r.forEach(function(x){var s=substitute(c,x[0]);var f=F_IOS[s[0]];if(!seen[f.g]){seen[f.g]=[];order.push(f.g)}seen[f.g].push({id:s[0],b:s[1]?null:x[1],from:s[1]})});
 order.forEach(function(g,i){h+=proj('項目：'+G_IOS[g]);if(i>0)h+=bridge('「'+G_IOS[order[i-1]]+'」講完，換到「'+G_IOS[g]+'」，繼續解決您的需求。');seen[g].forEach(function(x){h+=fnHtml(c,u,x.id,x.b,x.from)})});
 return h;
}
function recIpad(c){
 var u=cust(c),m=M_IOS[c.model];var h='';
 h+=stage('① 快速展演（約 1 分鐘）','≥2 項硬體＋ 1 項專屬配件');
 u.hw.forEach(function(x){h+=itemHtml('硬體：'+tagName(c,x[0]),m[x[0]],x[1],hwScript(c,x[0],u,x[1]))});
 var accName=u.acc==='kb'?'巧控鍵盤':'Apple Pencil';
 h+=itemHtml('專屬配件：'+accName,ACC_IOS[c.model][u.acc],u.acc==='kb'?'磁吸上去就能打字，像小筆電':'吸附或接線即可配對與充電',SCRIPT[c.model][u.acc==='kb'?'kb':'pencil']);
 h+=bridge(u.acc==='kb'?'鍵盤先接著不拆，等一下的加分功能會用到；接著進入「'+c.topic+'」的 iPad 功能。':'Apple Pencil 先拿在手上，等一下的手寫功能直接接著用；接著進入「'+c.topic+'」的 iPad 功能。');
 h+=stage('② 功能展演','≥2 項 iPad 功能＋≥2 項 Pencil 功能（鍵盤為加分）');
 var ig=[],pg=[],kg=[];
 u.r.forEach(function(x){var s=substitute(c,x[0]);var f=F_IOS[s[0]];var o={id:s[0],b:s[1]?null:x[1],from:s[1]};(f.g==='ipad'?ig:f.g==='pen'?pg:kg).push(o)});
 h+=proj('iPad 功能（'+c.topic+'）≥2 項');ig.forEach(function(x){h+=fnHtml(c,u,x.id,x.b,x.from)});
 h+=bridge(u.acc==='pencil'?'iPad 本身的功能講完，換手上的 Apple Pencil，把手寫與標示接著示範。':'iPad 本身的功能講完，把旁邊的 Apple Pencil 拿起來，示範手寫與標示。');
 h+=proj('Apple Pencil 功能 ≥2 項');pg.forEach(function(x){h+=fnHtml(c,u,x.id,x.b,x.from)});
 if(kg.length){h+=bridge('最後補充鍵盤，讓 iPad 能像小筆電一樣用。');h+=proj('鍵盤加分（選用）');kg.forEach(function(x){h+=fnHtml(c,u,x.id,x.b,x.from)})}
 return h;
}
function recMac(c){
 var u=cust(c),m=M_MAC[c.model];var h='';
 h+=stage('硬體展演（4 分鐘）','四項主題都要講；順序可依情境與腳本調整，下面是建議串場');
 h+=itemHtml('購買族群（點題開場）',[m.who,'',''],null,u.who);
 h+=itemHtml('外觀設計',m.design,'拿起機身，連回客人「帶著走」的需求',hwScript(c,'design',u,''));
 u.hw.forEach(function(x){h+=itemHtml('硬體好處：'+tagName(c,x[0]),m[x[0]],x[1],hwScript(c,x[0],u,x[1]))});
 var sc=u.scene.split('：'),spoken=sc[0],st=sc.slice(1).join('：');
 h+=itemHtml('適合情境（收尾示範）',['',st,''],null,spoken);
 h+=bridge('硬體講完了，接著換軟體展演，示範這台 Mac 怎麼幫您解決日常的事。');
 h+=stage('軟體展演（4 分鐘）','題目「'+T_MAC[c.topic]+'」至少講 3 個功能，每項都要操作完');
 if(c.topic==='t5')h+='<div class="fn"><div class="fh"><span class="nm">準備時間先做（不用說出口）</span></div>'+steps(PREP_WL.replace('準備時間先確認：','').replace('第一個功能建議放「通用剪貼板」最穩。','').replace(/。$/,''))+warnBox('第一個功能建議放「通用剪貼板」，最穩定')+'</div>';
 SW_FOR[c.model][c.ci][c.topic].forEach(function(id){h+=fnHtml(c,u,id,null)+altHint(id)});
 return h;
}
function recHtml(c){
 var h=c.type==='iphone'?recIphone(c):c.type==='ipad'?recIpad(c):recMac(c);
 var u=cust(c);
 h+=stage('收尾');h+='<div class="fn">'+lab('回扣痛點')+'<div class="good-t">'+bullets(u.p)+'</div><div class="tip">點名最貼近的 1–2 個功能收尾。</div></div>';
 return h;
}

// ---------- 卡片 ----------
function cardHtml(c){
 var u=cust(c);
 var h='<section class="card"><div class="hero"><div class="hb m"><span>機型</span><b>'+esc(c.model)+'</b></div>';
 h+='<div class="hb t"><span>'+(c.type==='mac'?'軟體題型':'題型')+'</span><b>'+esc(c.type==='mac'?T_MAC[c.topic]:c.topic)+'</b></div></div>';
 h+=tipBox(c);
 if(c.type==='ipad')h+='<div class="seg"><span>現場 Pencil：</span><button data-act="pencil" data-v="pro" class="'+(c.pencil==='pro'?'on':'')+'">Pro</button><button data-act="pencil" data-v="usbc" class="'+(c.pencil==='usbc'?'on':'')+'">USB-C</button></div>';
 h+=timersHtml(c);
 h+='<div class="cust">'+lab('客人')+bl(String(u.c).split('，'))+lab('情境')+bl(String(u.s).split('，'))+'</div>';
 h+='<div class="steps">';
 if(!c.need){
  h+='<button class="btn go" data-act="need"><span class="n">1</span><span>先按這裡：看客人需求<small>先自己想：這位客人需要什麼？</small></span></button>';
  h+='<button class="btn lock" disabled><span class="n">2</span><span>看推薦展演<small>🔒 完成步驟 1 後才能按</small></span></button>';
 }else{
  h+='<div class="need"><div class="done">✓ 步驟 1 完成</div><span class="nt">客人的需求／痛點</span>'+bullets(u.p)+'</div>';
  if(!c.rec)h+='<button class="btn go next" data-act="rec"><span class="n">2</span><span>下一步：看推薦展演<small>想好再看：硬體、功能與好處</small></span></button>';
  else h+='<div class="recbox"><div class="done">✓ 步驟 2 完成</div>'+outline(c)+recHtml(c)+'</div>';
 }
 h+='</div>';
 h+='<div class="navb"><div class="l">想換題？</div><div class="rowbtn"><button class="btn ghost" data-act="cust">換一位客人</button>'+(state.pinned?'<button class="btn ghost" data-act="repick">重新指定</button>':'<button class="btn ghost" data-act="redraw">重抽題目</button>')+'</div></div></section>';
 return h;
}

// ---------- 畫面 ----------
function home(){
 $('#main').innerHTML='<div class="home stack"><h1>數位檢定展演練習</h1><p class="sub">FY26 iOS Expert／Mac Specialist。先選檢定類別，再選「自動抽題」或「指定練習」（自己選機型、題型與客人，也能依功能找客人）。</p>'+
 '<button class="btn big" data-act="start" data-v="ios">iOS Expert<small>iPhone 展演＋iPad 展演</small></button>'+
 '<button class="btn big" data-act="start" data-v="mac">Mac Specialist<small>硬體＋軟體同一頁、同一位客人</small></button>'+
 '<div class="note"><b>怎麼練：</b>看到客人與情境後先自己想需求，再自己按「看客人需求」「看推薦展演」。推薦內容是預先備好的題庫，操作路徑請以現場機型實際介面為準；標示「路徑上機確認」的務必先練過。</div></div>';
}
// ---------- 選擇方式／指定練習／依功能找客人 ----------
function modeScreen(){
 var nm=state.kind==='ios'?'iOS Expert':'Mac Specialist';
 $('#main').innerHTML='<div class="home stack"><div class="top"><button class="btn sec back" data-act="home">← 首頁</button><h2>'+nm+'</h2></div>'+
 '<button class="btn big" data-act="auto">自動抽題<small>系統隨機抽機型、題型與客人</small></button>'+
 '<button class="btn big" data-act="pick">指定練習<small>自己選機型、題型，再選一位客人或隨機抽</small></button>'+
 '<button class="btn big" data-act="fnq">依功能找客人<small>選一個想加強的功能，看哪些客人會用到</small></button></div>';
 window.scrollTo(0,0);
}
function pkModels(s){return s==='iphone'?IPHONE_MODELS:s==='ipad'?IPAD_MODELS:MAC_MODELS}
function pkTopics(s){return s==='iphone'?Object.keys(C_IPHONE):s==='ipad'?Object.keys(C_IPAD):Object.keys(T_MAC)}
function pkInit(s){return {show:s,model:pkModels(s)[0],topic:pkTopics(s)[0]}}
function chips(act,items,cur){return '<div class="chips">'+items.map(function(x){return '<button class="chip'+(x[0]===cur?' on':'')+'" data-act="'+act+'" data-v="'+esc(x[0])+'">'+esc(x[1])+'</button>'}).join('')+'</div>'}
function showTabs(act,cur){
 if(state.kind!=='ios')return '';
 return '<div class="tabs">'+[['iphone','iPhone'],['ipad','iPad']].map(function(t){return '<button data-act="'+act+'" data-v="'+t[0]+'" class="'+(cur===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('')+'</div>';
}
function pickScreen(){
 var pk=state.pk,list=pk.show==='mac'?C_MACHW[pk.model]:(pk.show==='iphone'?C_IPHONE:C_IPAD)[pk.topic];
 var h='<div class="top"><button class="btn sec back" data-act="mode">← 返回</button><h2>指定練習</h2></div>'+showTabs('pkshow',pk.show);
 h+='<div class="card stack">'+lab('機型')+chips('pkmodel',pkModels(pk.show).map(function(m){return [m,m]}),pk.model);
 h+=lab(pk.show==='mac'?'軟體題型':'題型')+chips('pktopic',pkTopics(pk.show).map(function(k){return [k,pk.show==='mac'?T_MAC[k]:k]}),pk.topic);
 h+=lab('客人：點一位開始，或隨機')+'<button class="btn" data-act="pkgo" data-v="-1">隨機抽一位</button>';
 h+='<div class="plist">'+list.map(function(c,i){return '<button class="pitem" data-act="pkgo" data-v="'+i+'"><b>'+(i+1)+'</b><span>'+esc(c.c)+'</span></button>'}).join('')+'</div></div>';
 $('#main').innerHTML=h;
}
function startCard(show,model,topic,ci){
 var c=newCard(show);c.model=model;c.topic=topic;c.ci=ci<0?pick(key(c),custList(c).length):ci;c.timers=mkTimers(show);
 state.view=state.kind;state.cards=[c];state.tab=0;state.pinned=true;render();window.scrollTo(0,0);ensureTick();
}
function fnHeads(show){
 var F=show==='mac'?F_MAC:F_IOS,gs=show==='iphone'?['im','ph','cam','vid','pho','sys','note','com']:show==='ipad'?['ipad','pen','kb']:['t1','t2','t3','t4','t5'];
 var heads=[],map={};
 function add(h,id){if(!map[h]){map[h]=[];heads.push(h)}map[h].push(id)}
 var ip={ib:'iPad 基礎操作',iw:'iPad 工作生產',ic:'iPad 創意創作'};
 gs.forEach(function(g){
  if(g==='ipad'){['ib','iw','ic'].forEach(function(pf){Object.keys(F).forEach(function(id){if(F[id].g==='ipad'&&id.slice(0,2)===pf)add(ip[pf],id)})});return}
  Object.keys(F).forEach(function(id){if(F[id].g===g)add(show==='mac'?T_MAC[g]:G_IOS[g],id)});
 });
 heads.forEach(function(h){map[h].sort(function(a,b){return (parseInt(a.replace(/\D/g,''),10)||0)-(parseInt(b.replace(/\D/g,''),10)||0)})});
 return heads.map(function(h){return [h,map[h]]});
}
function fnResults(show,fid){
 var out=[];
 if(show==='mac'){var t=F_MAC[fid].g;Object.keys(C_MACHW).forEach(function(m){C_MACHW[m].forEach(function(c,i){if(SW_FOR[m][i][t].indexOf(fid)>-1)out.push({model:m,topic:t,i:i,c:c.c,label:m+'・'+T_MAC[t]})})})}
 else{var L=show==='iphone'?C_IPHONE:C_IPAD;Object.keys(L).forEach(function(t){L[t].forEach(function(c,i){if(c.r.some(function(x){return x[0]===fid}))out.push({topic:t,i:i,c:c.c,label:t})})})}
 return out;
}
function fqModelDefault(show,fid){
 if(show==='mac')return null;
 var f=F_IOS[fid],ms=pkModels(show);
 if(show==='iphone'&&f.ban){var ok=ms.filter(function(m){return f.ban.indexOf(m==='iPhone Air'?'air':m==='iPhone 17'?'17':'pro')<0});if(ok.length)return ok[0]}
 return ms[0];
}
function fnScreen(){
 var q=state.fq,F=q.show==='mac'?F_MAC:F_IOS;
 var h='<div class="top"><button class="btn sec back" data-act="mode">← 返回</button><h2>依功能找客人</h2></div>';
 if(!q.fid){
  h+=showTabs('fqshow',q.show)+'<div class="card">'+lab('選一個想練的功能');
  fnHeads(q.show).forEach(function(g){h+='<div class="fgrp">'+esc(g[0])+'</div><div class="chips">'+g[1].map(function(id){return '<button class="chip" data-act="fqfn" data-v="'+id+'">'+esc(nm0(F[id]))+'</button>'}).join('')+'</div>'});
  h+='</div>';
 }else{
  var f=F[q.fid],res=fnResults(q.show,q.fid);
  h+='<div class="card stack"><div class="fsel"><b>'+esc(f.n)+'</b><small>'+esc(f.t)+'</small></div><button class="btn sec" data-act="fqclr">換一個功能</button>';
  if(q.show!=='mac'){
   var onlyPro=q.show==='iphone'&&f.ban;
   h+=lab('練習用機型')+chips('fqmodel',pkModels(q.show).map(function(m){return [m,m]}),q.model);
   if(onlyPro)h+='<div class="tip">這個功能只有部分機型支援，選到不支援的機型時會自動換成備案功能。</div>';
  }
  h+=lab('會用到這個功能的客人（'+res.length+' 位）：點一位開始');
  h+=res.length?'<div class="plist">'+res.map(function(r,i){return '<button class="pitem" data-act="fqgo" data-v="'+i+'"><b>'+(i+1)+'</b><span><em>'+esc(r.label)+'</em>'+esc(r.c)+'</span></button>'}).join('')+'</div>':'<div class="note">目前題庫沒有客人用到這個功能。</div>';
  h+='</div>';
 }
 $('#main').innerHTML=h;
}

function session(kind){
 state.pinned=false;state.view=kind;state.tab=0;
 state.cards=kind==='ios'?[newCard('iphone'),newCard('ipad')]:[newCard('mac')];
 render();
}
function render(){
 if(state.view==='home'){home();window.scrollTo(0,0);return}
 if(state.view==='mode'){modeScreen();return}
 if(state.view==='pick'){pickScreen();return}
 if(state.view==='fn'){fnScreen();return}
 var h='<div class="top"><button class="btn sec back" data-act="home">← 首頁</button><h2>'+(state.view==='ios'?'iOS Expert':'Mac Specialist')+'</h2></div>';
 if(state.cards.length>1)h+='<div class="tabs">'+['iPhone','iPad'].map(function(t,i){return '<button data-act="tab" data-v="'+i+'" class="'+(state.tab===i?'on':'')+'">'+t+'</button>'}).join('')+'</div>';
 h+=cardHtml(state.cards[state.tab]);
 $('#main').innerHTML=h;
}

// ---------- 事件 ----------
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
 var a=b.getAttribute('data-act'),v=b.getAttribute('data-v');var c=state.cards[state.tab];var keepY=window.scrollY;
 if(a==='start'){state.kind=v;state.view='mode';state.cards=[];render();return}
 if(a==='auto'){session(state.kind);window.scrollTo(0,0);ensureTick();return}
 if(a==='mode'){state.view='mode';state.cards=[];render();return}
 if(a==='pick'){state.pk=pkInit(state.kind==='ios'?'iphone':'mac');state.view='pick';render();window.scrollTo(0,0);return}
 if(a==='pkshow'){state.pk=pkInit(v);render();return}
 if(a==='pkmodel'){state.pk.model=v;render();window.scrollTo(0,keepY);return}
 if(a==='pktopic'){state.pk.topic=v;render();window.scrollTo(0,keepY);return}
 if(a==='pkgo'){startCard(state.pk.show,state.pk.model,state.pk.topic,+v);return}
 if(a==='repick'){state.pk={show:c.type,model:c.model,topic:c.topic};state.view='pick';render();window.scrollTo(0,0);return}
 if(a==='fnq'){state.fq={show:state.kind==='ios'?'iphone':'mac',fid:null,model:null};state.view='fn';render();window.scrollTo(0,0);return}
 if(a==='fqshow'){state.fq={show:v,fid:null,model:null};render();return}
 if(a==='fqfn'){state.fq.fid=v;state.fq.model=fqModelDefault(state.fq.show,v);render();window.scrollTo(0,0);return}
 if(a==='fqclr'){state.fq.fid=null;render();window.scrollTo(0,0);return}
 if(a==='fqmodel'){state.fq.model=v;render();window.scrollTo(0,keepY);return}
 if(a==='fqgo'){var q=state.fq,r=fnResults(q.show,q.fid)[+v];startCard(q.show,q.show==='mac'?r.model:q.model,r.topic,r.i);return}
 if(a==='home'){state.view='home';state.cards=[];render();return}
 if(a==='tab'){state.tab=+v;render();window.scrollTo(0,0);return}
 if(a==='need'){c.need=true}
 else if(a==='rec'){c.rec=true}
 else if(a==='cust'){reroll(c)}
 else if(a==='redraw'){redraw(c)}
 else if(a==='pencil'){c.pencil=v}
 else if(a==='timer'){var t=c.timers[+v];t.run=!t.run}
 else if(a==='treset'){c.timers[+v].sec=0;c.timers[+v].run=false}
 render();
 if(a==='need'||a==='rec'||a==='timer'||a==='treset'||a==='pencil')window.scrollTo(0,keepY);else window.scrollTo(0,0);
});
home();
})();
</script>
