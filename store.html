<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#fbf6ef">
<title>門市展演練習｜德誼 內部訓練</title>
<style>
:root{--bg:#fbf6ef;--card:#fff;--ink:#2a2420;--sub:#7a6f66;--line:#eadfd2;--soft:#f5ede2;--bub:#fff;--you:#fff;--ok:#2f8f5b;--warn:#a85b00;--warnbg:#fff1dc;
--pc:#ee5a47;--pcs:#fde9e6;--pci:#fff;--cav:#d8c6ac;--cavi:#4a3a28}
[data-p=iphone]{--pc:#e5493a;--pcs:#fde9e6}
[data-p=ipad]{--pc:#6d4de8;--pcs:#eee9fd}
[data-p=mac]{--pc:#0b8a7c;--pcs:#dff5f1}
[data-p=watch]{--pc:#b45309;--pcs:#fdecd3}
@media(prefers-color-scheme:dark){:root{--bg:#17130f;--card:#231d18;--ink:#f6efe6;--sub:#b3a699;--line:#3a312a;--soft:#2c241d;--bub:#2c241d;--you:#2c241d;--ok:#52c58a;--warn:#ffb340;--warnbg:#3a2a10;--cav:#4a3f35;--cavi:#f6efe6}
[data-p=iphone]{--pc:#ff7a68;--pcs:#3a1f1b;--pci:#2a1210}
[data-p=ipad]{--pc:#a58bff;--pcs:#2a2144;--pci:#1b1236}
[data-p=mac]{--pc:#34d3c1;--pcs:#10312d;--pci:#06231f}
[data-p=watch]{--pc:#fbbf24;--pcs:#3a2d0f;--pci:#2a1d03}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:620px;margin:0 auto;padding:0 14px 8px}
p{margin:0}
.cl{display:inline-block;vertical-align:top;text-wrap:balance}
button{font-family:inherit}
/* 首頁 */
.brand{padding:26px 4px 6px}
.brand h1{font-size:28px;line-height:1.25;margin:0;letter-spacing:.02em}
.brand p{color:var(--sub);margin-top:6px;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.tile{border:0;border-radius:24px;padding:20px 14px 18px;text-align:left;color:var(--pci);background:var(--pc);min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;position:relative;overflow:hidden}
.tile::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.18)}
.tile b{font-size:22px;line-height:1.2;font-weight:800;display:block;position:relative;z-index:1}
.tile span{display:block;font-size:13px;margin-top:6px;opacity:.92;position:relative;z-index:1}
.tile i{position:absolute;left:14px;top:14px;font-style:normal;font-size:12px;font-weight:700;letter-spacing:.08em;background:rgba(255,255,255,.25);border-radius:99px;padding:2px 10px;z-index:1}
.note{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:12px 14px;font-size:14px;color:var(--sub)}
.note b{color:var(--ink)}
/* 頂欄 */
.bar{position:sticky;top:0;z-index:5;margin:0 -14px;padding:10px 14px;background:var(--pc);color:var(--pci);display:flex;align-items:center;gap:10px}
.bar button{border:0;background:rgba(255,255,255,.22);color:inherit;font:700 14px inherit;border-radius:99px;padding:7px 14px;min-height:36px;cursor:pointer}
.bar h2{margin:0;font-size:clamp(14px,4.4vw,17px);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button,.bar small{flex:0 0 auto;white-space:nowrap}
.bar small{font-size:12px;opacity:.9}
/* 接待票卡 */
.ticket{margin-top:14px;background:var(--card);border-radius:22px;border:1px solid var(--line);overflow:hidden}
.ticket .tp{padding:14px 16px 4px}
.ticket .rib{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--pc);background:var(--pcs);border-radius:99px;padding:2px 12px}
.ticket h3{font-size:24px;line-height:1.3;margin:8px 0 2px;font-weight:800}
.two{padding:4px 16px 14px}
.tt{font-size:13px;font-weight:800;color:var(--pc);margin:10px 0 2px;letter-spacing:.06em}
ul.dots{list-style:none;margin:0;padding:0}
ul.dots li{position:relative;padding:2px 0 2px 18px;font-size:17px}
ul.dots li::before{content:"";position:absolute;left:3px;top:.82em;width:8px;height:8px;border-radius:50%;background:var(--pc)}
.chat{display:flex;gap:10px;align-items:flex-start;padding:12px 16px 16px;background:var(--soft)}
.chat.bare{padding:0;background:none;gap:6px}
.chat.bare .av{width:32px;height:32px;font-size:13px}
.chat.me{flex-direction:row-reverse}
.av{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:var(--cav);color:var(--cavi);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;line-height:1}
.av.me{background:var(--pc);color:var(--pci)}
.bub{position:relative;min-width:0;flex:0 1 auto;background:var(--bub);border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:10px 14px;font-size:17px;line-height:1.7;max-width:100%}
.bub.you{border-radius:18px 18px 4px 18px;background:var(--pcs);border-color:transparent}
.bub.cu{border-radius:18px 18px 18px 4px}
.who{font-size:12px;color:var(--sub);margin-bottom:2px}
/* 時間軸 */
.tl{margin:18px 0 6px;position:relative}
.st{position:relative;padding:0 0 18px 46px}
.st::before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--line)}
.st:last-child::before{display:none}
.nd{position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;background:var(--card);border:2px solid var(--line);color:var(--sub);font:800 15px/28px inherit;text-align:center}
.st.on .nd{background:var(--pc);border-color:var(--pc);color:var(--pci)}
.st.next .nd{border-color:var(--pc);color:var(--pc);box-shadow:0 0 0 5px var(--pcs)}
.st.on::before{background:var(--pc)}
.sh{min-height:32px;display:flex;flex-direction:column;justify-content:center}
.sh b{font-size:18px;font-weight:800}
.sh span{font-size:13px;color:var(--sub)}
.st:not(.on):not(.next) .sh b,.st:not(.on):not(.next) .sh span{color:var(--sub);opacity:.6}
.sb{margin-top:10px}
.go{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:10px;border:0;border-radius:20px;background:var(--pc);color:var(--pci);padding:12px 14px 12px 18px;text-align:left;cursor:pointer;min-height:64px;box-shadow:0 6px 16px rgba(0,0,0,.14)}
.go .gt{display:block;min-width:0}
.go .gt b{display:block;font-size:17px;line-height:1.35;font-weight:800}
.go .gt small{display:block;font-weight:500;font-size:13px;line-height:1.4;opacity:.92;margin-top:2px}
.go .ar{flex:0 0 auto;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;font-weight:800}
.tips{background:var(--soft);border-radius:14px;padding:8px 14px;margin-bottom:10px}
.tips .tt{margin-top:2px}
.youq{margin:10px 0}
.youq .bub{max-width:100%}
.cust-say{margin:10px 0}
.notes{display:grid;gap:8px}
.notes div{background:var(--pcs);border-radius:14px;padding:10px 14px 10px 40px;position:relative;font-size:17px;font-weight:600}
.notes div::before{content:"✓";position:absolute;left:14px;top:9px;color:var(--pc);font-weight:900}
/* 推薦 */
.skel{background:var(--soft);border-radius:14px;padding:10px 14px;font-size:15px;font-weight:700;margin-bottom:10px}
.skel span{color:var(--pc)}
.mcard{border:2px solid var(--pc);border-radius:18px;padding:12px 14px;background:var(--card)}
.mcard .mt{font-size:12px;font-weight:800;color:var(--pc);letter-spacing:.12em}
.mcard h4{margin:0 0 4px;font-size:clamp(18px,5.6vw,22px);font-weight:800;text-wrap:balance}
.mcard.alt{margin-top:10px;border:2px dashed var(--pc);background:var(--soft)}
.mcard .say{margin-top:6px;font-size:15px;font-weight:700;color:var(--pc)}
.mcard p{margin:2px 0 0;font-size:16px}
.why{margin:6px 0 0 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 14px}
.why .tt{margin-top:2px}
.why .pq{margin-top:6px;font-size:15px;font-weight:700;color:var(--pc)}
.tips.price{background:var(--pcs)}
.fab{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.fab .fh{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--pcs);flex-wrap:wrap}
.fab .no{font-size:12px;font-weight:700;color:var(--pc)}
.fab .nm{font-size:18px;font-weight:800}
.badge{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--warnbg);color:var(--warn)}
.row{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .k{font-size:13px;font-weight:800;color:var(--pc);padding-top:3px}
.row .v{font-size:17px}
.row .v.g{font-weight:800}
ol.sp{list-style:none;margin:0;padding:0;counter-reset:s}
ol.sp li{counter-increment:s;position:relative;padding:3px 0 3px 28px}

.plab{font-size:13px;font-weight:700;margin:4px 0 0}
.w{margin:0 14px 12px;font-size:13px;color:var(--warn);background:var(--warnbg);padding:6px 10px;border-radius:10px}
.tipline{font-size:13px;color:var(--sub);margin-top:6px}
.cq{margin:8px 0}
.check{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 14px}
.check div{position:relative;padding:8px 0 8px 32px;border-top:1px solid var(--line);font-size:17px}
.check div:first-child{border-top:0}
.check div::before{content:"";position:absolute;left:2px;top:12px;width:18px;height:18px;border-radius:5px;border:2px solid var(--pc)}
.done{font-weight:800;color:var(--ok);margin:6px 0}
.after{display:flex;gap:10px;margin:8px 0 4px}
.after button{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:12px 10px;font-weight:800;font-size:15px;min-height:48px;cursor:pointer}
.after button.p{background:var(--pc);border-color:var(--pc);color:var(--pci)}
.row1{padding:8px 14px 10px}
.rc{border:1px solid var(--line);border-radius:14px;background:var(--card);margin:8px 0;overflow:hidden}
.rq,.ra{padding:8px 14px;font-size:17px}
.rq{background:var(--soft)}
.ra{background:var(--pcs);font-weight:700}
.tg{display:block;width:max-content;font-size:12px;font-weight:800;border-radius:99px;padding:0 9px;margin:0 0 3px;background:var(--cav);color:var(--cavi)}
.tg.me{background:var(--pc);color:var(--pci)}
.conc{margin:10px 0;background:var(--card);border:2px solid var(--pc);border-radius:14px;padding:10px 14px;font-size:17px;font-weight:700}
.conc b{color:var(--pc)}
.ticket h3,.w,.tipline,.sh span,.sh b,.fab .nm,.conc,.skel,.go .gt b,.go .gt small{text-wrap:balance}
.bub,.row .v,.rq,.ra,ul.dots li,.check div,.notes div{text-wrap:pretty}
footer{margin-top:24px;padding:18px 14px calc(18px + env(safe-area-inset-bottom));text-align:center;border-top:1px solid var(--line);background:var(--card)}

function shuffle(n){var a=[],i,j,t;for(i=0;i<n;i++)a.push(i);for(i=n-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t}return a}
function drawNext(){
 var p=state.p,len=STORE[p].length;
 if(!state.deck[p]||state.pos[p]>=len){var d=shuffle(len);if(state.cur!=null&&len>1&&d[0]===state.cur){var t=d[0];d[0]=d[1];d[1]=t}state.deck[p]=d;state.pos[p]=0}
 state.cur=state.deck[p][state.pos[p]++];state.step=0;
}
var WP={im4:'先確認是 iMessage 群組，投票就能順利示範',c2:'請同伴入鏡；若沒出現距離提示，稍微後退一點就會出現',v2:'請同伴揮手或走動，慢動作更明顯',p2:'自動整理，不需網路',ph1:'iOS 26 起提供，示範前先在機器上確認',im5:'示範前先確認繁體中文的顯示位置',m3:'事先備好一張含中文字的素材',c8:'示範前先確認這台機型的介面位置',m5:'現場使用展示素材，保護客人的卡片資訊',p1:'事先備好幾張展示機的照片素材',v4:'邊走邊錄，效果更明顯',v6:'示範前先確認雙向同拍的入口位置',p3:'需啟用 Apple Intelligence，首次使用先試一次，示範更順利',s1:'接好充電線並橫放，待機模式就會出現',s2:'示範前先確認編輯入口位置',pe2:'字跡端正，辨識更準確；Pro 與 USB-C 款 Apple Pencil 都支援',ic3:'示範前先確認工具列圖示位置',pe1:'從角落向內滑，先試一次手感；Pencil Pro 與 USB-C 款都支援',pe6:'壓力感應使用 Apple Pencil Pro；USB-C 款可示範傾斜與工具切換',pe5:'使用 Apple Pencil Pro',ic4:'示範前先確認標示入口位置',iw3:'先在機器上設好切換模式，示範更順利',iw5:'事先備好 PDF 素材；示範前先確認預覽介面',kb1:'使用與這台 iPad 相符的鍵盤',iw1:'請同伴入鏡；通話對象用同伴的手機，更自然',ic1:'示範前先確認介面名稱',ib3:'示範前先確認入口位置',ib2:'示範前先確認手勢操作',ib1:'示範前先確認入口位置',ib4:'示範前先確認入口位置',ic2:'示範前先確認進階項目',pe3:'辨識結果會依筆跡而不同，先備好例子',iw6:'展示機先備好多則備忘錄；整理時保留原有素材',iw2:'示範完成後，把主畫面還原',kb2:'確認鍵盤軌跡板已連線',mf3:'Windows 的 Ctrl 對應 Mac 的 Command',mf11:'示範前先確認選單文字位置',mf1:'示範前先確認標籤入口位置',kn2:'示範前先確認面板名稱',mp4:'影片素材事先放入照片圖庫',mp5:'附近有可用的 iPhone，並開啟 Wi-Fi 與藍牙',mp6:'示範前先確認選單文字位置',wl1:'等候幾秒即可接續；兩台使用同一個 Apple 帳號，並開啟藍牙與 Wi-Fi',wl5:'最穩定、零設定；拷貝後馬上貼上',wl3:'iPhone 保持鎖定狀態；台灣可使用',pg5:'協作需要 iCloud 帳號',pg9:'登入同一個 Apple 帳號',kn10:'登入同一個 Apple 帳號',wl2:'iPhone 放在附近並解鎖；掃描文件會自動裁切、校正',mp3:'示範前先確認 Apple Intelligence 支援；若無法使用，改示範「編輯相片」',kn5:'連上網路後，網路影片就能播放'};
function fnCard(id,b){
 var f=FALL[id];
 var h='<div class="fab"><div class="fh"><span class="no">'+esc(f.no)+'</span><span class="nm">'+esc(f.n)+'</span>'+'</div>';
 h+='<div class="row"><div class="k">是什麼</div><div class="v">'+ph(f.t)+'</div></div>';
 h+='<div class="row"><div class="k">好處</div><div class="v g">'+ph(b)+'</div></div>';
  var ww=WP[id]||f.w;if(ww)h+='<div class="w">'+ph('小提醒：'+ww)+'</div>';
 return h+'</div>';
}
function bubC(txt,who){return '<div class="chat bare cust-say"><div class="av">客</div><div class="bub cu">'+(who?'<div class="who">'+who+'</div>':'')+ph(txt)+'</div></div>'}
function bubMe(txt,who){return '<div class="chat bare me youq"><div class="av me">你</div><div class="bub you">'+(who?'<div class="who">'+who+'</div>':'')+ph(txt)+'</div></div>'}
function replyBox(a){return '<div class="chat bare me youq"><div class="av me">你</div><div class="bub you"><div class="who">你可以這樣回應</div>'+dots(a)+'</div></div>'}
function content(c,i){
 if(i===0)return (c.price?'<div class="tips price"><div class="tt">客人先問價錢時</div>'+dots(PRICE_TIPS)+'</div>':'')+'<div class="tips"><div class="tt">開場小技巧</div>'+dots(OPEN_TIPS)+'</div>'+c.ask.map(function(q,k){return bubMe(q,(c.askL||ASK_LABELS)[k])}).join('');
 if(i===1)return '<div class="tipline" style="margin:0 0 4px">問完之後，您會聽到客人這樣說：</div>'+c.need.map(function(x){return bubC(x.replace(/^希望/,'我希望'))}).join('');
 if(i===2){
  var h='<div class="skel">串聯句型：<span>我聽到您希望…</span>，這個功能可以…，所以…</div>';
  h+='<div class="mcard"><div class="mt">'+(c.alt&&c.alt.dir==='down'?'優先推薦機型':'推薦機型')+'</div><h4>'+esc(c.model.m)+'</h4>'+dots(c.model.why)+'<div class="tipline">數字與規格以台灣官網為準</div></div>';
  if(c.alt)h+='<div class="mcard alt"><div class="mt">'+(c.alt.dir==='down'?'客人還有其他考量時，往這一款帶':'也可以請客人一起比較')+'</div><h4>'+esc(c.alt.m)+'</h4>'+dots(c.alt.why.split('；'))+'<div class="say">'+ph(c.alt.say)+'</div></div>';
  c.fn.forEach(function(x){h+=fnCard(x[0],x[1])});
  return h;
 }
 if(i===3)return '<div class="tipline" style="margin:0 0 6px">'+ph('客人說的，不一定是真正在意的：先肯定、再多問一句，找出真正的原因。')+'</div>'+c.concerns.map(function(q){return '<div class="cq">'+bubC(q.q)+replyBox(q.a)+(q.r?'<div class="why"><div class="tt">這句話背後，可能是</div>'+dots(q.r)+'<div class="pq">多問一句：'+ph(q.pr)+'</div></div>':'')+'</div>'}).join('');
 if(i===4)return recap(c)+'<div class="fab"><div class="fh"><span class="nm">主動邀請決定</span></div><div class="row1">'+dots(INVITE)+'</div></div><div class="tipline" style="margin:12px 0 6px">收尾前，再確認這四件事：</div><div class="check">'+['先確認客人的感受：「聽下來，哪一部分最符合您的需求？」'].concat(c.close.slice(1)).map(function(x){return '<div>'+ph(x)+'</div>'}).join('')+'</div><div class="fab"><div class="fh"><span class="nm">最後，自然帶出三項延伸</span></div><div class="row1"><div class="tipline" style="margin:0 0 4px">每位客人都主動介紹，放在最後，像貼心提醒：</div><div class="skel" style="margin:6px 0">'+ph(EXT_SAY)+'</div>'+dots(EXT[state.p])+'</div></div>';
 return grow(c);
}
function nm0(n){return n.replace(/[（(].*?[）)]/g,'')}
function recap(c){
 var h='<div class="tipline" style="margin:0 0 8px">回到客人說的期待，逐一連結我們的推薦：</div>';
 c.need.forEach(function(n,k){
  var f=FALL[c.fn[k][0]];
  h+='<div class="rc"><div class="rq"><span class="tg">客人期待</span>'+ph('我'+n)+'</div><div class="ra"><span class="tg me">我們的推薦</span>'+ph(nm0(f.n)+'：'+c.fn[k][1])+'</div></div>';
 });
 h+='<div class="conc"><b>結論</b>　'+ph(c.model.m.replace(/ /g,'\u00a0')+' 很適合這位客人：'+c.model.why[0])+'</div>';
 return h;
}
function grow(c){
 var rs=c.concerns.map(function(q){return q.q.replace(/[「」]/g,'')});
 var h='<div class="tipline" style="margin:0 0 8px">我們的目的是成交；客人還需要時間，也要把每一位客人好好培養起來，珍惜每個回流客與新客的機會。</div>';
 h+='<div class="fab"><div class="fh"><span class="nm">① 先自我檢視</span></div><div class="row1">'+dots(SELF)+'</div></div>';
 h+='<div class="fab"><div class="fh"><span class="nm">② 探詢客人考慮的點</span></div><div class="row1">'+dots(['先肯定：「謝謝您今天花時間了解」','開放式提問：「想再考慮的是哪一部分呢？」','客人說的和真正在意的，常常不同：多問一句，就更接近答案','可能的方向：功能、預算、和家人討論、與其他機型比較、購買時機'].concat(rs.map(function(x){return '這位客人可能想的：'+x})))+'</div></div>';
 h+='<div class="fab"><div class="fh"><span class="nm">③ 留下後續連結</span></div><div class="row1">'+dots(['先徵得客人同意，再留下聯繫方式',FOLLOW[state.p],'邀請加入門市 LINE@，方便後續聯繫與提供資訊','約定下次回訪或再次體驗的時間','簡單記錄客人的需求與考慮的點，方便追蹤（依公司作業為準）'])+'</div></div>';
 h+='<div class="fab"><div class="fh"><span class="nm">④ 培養客人的心態</span></div><div class="row1">'+dots(MIND)+'</div></div>';
 return h;
}
function session(){
 var p=state.p,c=STORE[p][state.cur],pr=PROD[p],st=state.step;
 var h='<div class="bar"><button data-act="home">← 首頁</button><h2>'+esc(pr.n)+' 門市練習</h2><small>客人 '+state.pos[p]+' / '+STORE[p].length+'</small></div>';
 h+='<section class="ticket"><div class="tp"><span class="rib">進店客人</span><h3>'+esc(c.name)+'</h3></div><div class="two"><div class="tt">客人</div>'+dots(c.c)+'<div class="tt">當下情境</div>'+dots(c.s)+'</div>';
 h+='<div class="chat"><div class="av">客</div><div class="bub cu"><div class="who">客人走進門市，說</div>'+ph(c.open)+'</div></div></section>';
 h+='<div class="tl">';
 TITLES.forEach(function(t,i){
  var on=st>i,nx=st===i,cls=on?'on':nx?'next':'';
  h+='<div class="st '+cls+'"><div class="nd">'+(i+1)+'</div><div class="sh"><b>'+t[0]+'</b><span>'+t[1]+'</span></div>';
  if(on)h+='<div class="sb">'+content(c,i)+'</div>';
  if(nx)h+='<button class="go" data-act="next"><span class="gt"><b>'+(i===0?'先按這裡：':'下一步：')+BTN[i][0]+'</b><small>'+BTN[i][1]+'</small></span><span class="ar">→</span></button>';
  h+='</div>';
 });
 h+='</div>';
 if(st>=TITLES.length)h+='<div class="done">✓ 六個步驟完成，這位客人練習結束</div>';
 h+='<div class="after"><button class="p" data-act="again">換一位客人</button><button data-act="home">選其他主體</button></div>';
 return h;
}
function home(){
 return '<div class="brand"><h1>門市展演練習</h1><p>以門市銷售為出發：探詢 → 期待 → 推薦 → 回應 → 成交 → 培養客人。選一個主體，立刻遇見一位進店客人。</p></div>'+
 '<div class="grid">'+ORDER.map(function(k){var p=PROD[k];return '<button class="tile" data-p="'+k+'" data-act="start" data-v="'+k+'"><i>'+p.ico+'</i><b>'+esc(p.n)+'</b><span>'+esc(p.tag)+'</span></button>'}).join('')+'</div>'+
 '<div class="note"><b>怎麼練：</b>看到客人後，先自己想怎麼迎接，再逐步按下一步。客人與情境每主體 10 位，全部走過一輪才會重複。內容是預先備好的題庫，示範前請先在現場機器上練習過。價格與優惠一律以現場公告為準。</div>';
}
function render(){
 var app=$('#app');
 if(state.p){app.setAttribute('data-p',state.p);$('#main').innerHTML=session()}
 else{app.removeAttribute('data-p');$('#main').innerHTML=home()}
}
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-act]');if(!b)return;
 var a=b.getAttribute('data-act'),v=b.getAttribute('data-v'),y=window.scrollY;
 if(a==='start'){state.p=v;drawNext();render();window.scrollTo(0,0);return}
 if(a==='again'){drawNext();render();window.scrollTo(0,0);return}
 if(a==='home'){state.p=null;render();window.scrollTo(0,0);return}
 if(a==='next'){state.step++;render();window.scrollTo(0,y)}
});
render();
})();
</script>
</body>
</html>
